name: 标签构建与草稿发布

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: 获取资源并检查源码
        shell: pwsh
        run: |
          ./tools/prepare.ps1
          ./tools/privacy-check.ps1
      - name: 完整检查
        shell: pwsh
        run: |
          ./src/build.ps1 -Tests
          & ./src/验证.exe
          if ($LASTEXITCODE -ne 0) { throw '自动检查失败' }
      - name: 从标签构建并打包
        shell: pwsh
        run: ./tools/package.ps1 -Version "$($env:GITHUB_REF_NAME.Substring(1))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-files
          path: artifacts
      - name: 创建预览版草稿并上传附件
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft --prerelease --title "快译截图 $RELEASE_TAG · 预览版" --notes-file docs/发布说明.md
