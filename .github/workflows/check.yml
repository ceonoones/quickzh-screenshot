name: Windows 检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: 获取并核验 OCR 资源
        shell: pwsh
        run: ./tools/prepare.ps1
      - name: 源码隐私检查
        shell: pwsh
        run: ./tools/privacy-check.ps1
      - name: 编译与完整检查
        shell: pwsh
        run: |
          ./src/build.ps1 -Tests
          & ./src/验证.exe
          if ($LASTEXITCODE -ne 0) { throw '自动检查失败' }
          ./src/build.ps1
